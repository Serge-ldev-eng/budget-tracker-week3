<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker | Smart Spend</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="card header-card">
      <h1>Smart Spend</h1>
      <p>Track your expenses. Stay in control.</p>
    </header>

    <section class="card form-card">
      <h2>Add New Expense</h2>
      <form id="expense-form">
        <div class="form-row">
          <div class="form-group">
            <label>Description</label>
            <input type="text" placeholder="e.g., Groceries, Transport" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select required>
              <option>Select category</option>
              <option>Food</option>
              <option>Transport</option>
              <option>Housing</option>
              <option>Entertainment</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Amount (KES)</label>
            <input type="number" placeholder="500" required>
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" required>
          </div>
        </div>
        <button type="submit" class="btn-primary">Add Expense</button>
      </form>
    </section>

    <section class="card table-card">
      <div class="table-header">
        <h2>Your Expenses</h2>
        <span class="badge">Week 3</span>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr>
          </thead>
          <tbody>
            <tr><td>2026-05-10</td><td>Market Groceries</td><td><span class="tag tag-food">Food</span></td><td>KES 2,500</td></tr>
            <tr><td>2026-05-09</td><td>Matatu to Town</td><td><span class="tag tag-transport">Transport</span></td><td>KES 300</td></tr>
            <tr><td>2026-05-08</td><td>Netflix</td><td><span class="tag tag-ent">Entertainment</span></td><td>KES 1,200</td></tr>
            <tr><td>2026-05-07</td><td>Rent Top-up</td><td><span class="tag tag-housing">Housing</span></td><td>KES 8,000</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
